<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fivem-graphics-mod</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="frame" aria-hidden="true">
        <div id="low-health"></div>
        <div id="hit-vignette"></div>
        <div id="rain"></div>
        <div id="blood"></div>
    </div>
    <div id="preview" hidden>
        <p>Pré-visualização dos efeitos de tela. No jogo eles ficam por cima da imagem, com o centro livre.</p>
        <label>Chuva <input id="rain-level" type="range" min="0" max="100" value="0" /></label>
        <button type="button" id="btn-cine" data-drops="22">Quality</button>
        <button type="button" id="btn-perf" data-drops="9">Performance</button>
        <button type="button" id="btn-hit">Dano leve</button>
        <button type="button" id="btn-hit-hard">Dano forte</button>
        <button type="button" id="btn-clear">Limpar</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
